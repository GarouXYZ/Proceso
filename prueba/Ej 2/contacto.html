<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <main>
        <form action="contacto.html" method="post">
            <fieldset>
                <legend>Contacta con Nosotros</legend>

                <label for="nombre">Nombre
                    <input type="text" id="nombre">
                </label> <br>

                <label for="correo">Correo Electronico
                    <input type="email" id="correo">
                </label> <br>

                <label for="asunto">Asunto
                    <input type="text" id="asunto">
                </label> <br>

                <label for="mensaje">Mensaje
                    <textarea name="" id="mensaje"></textarea>
                </label> <br>

                <label for="categoria">Categoria del Mensaje
                    <select type="text" id="categoria">
                        <option value="">Sugerencia</option>
                        <option value="">Queja</option>
                        <option value="">Consulta</option>
                    </select>
                </label> <br>
            </fieldset>
            <input type="submit" value="Enviar">
        </form>
    </main>
</body>
</html>
